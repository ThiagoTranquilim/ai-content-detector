dataset:
  path: data/raw/text_dataset.csv
  text_column: text
  label_column: generated

split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42

cleaning:
  min_chars: 20
  lowercase: true
  remove_urls: true
  remove_emails: true
  remove_extra_spaces: true

vectorizer:
  max_features: 50000
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.95

model:
  max_iter: 1000
  class_weight: balanced

artifacts:
  model_path: artifacts/models/text_baseline.joblib
  vectorizer_path: artifacts/vectorizers/tfidf_vectorizer.joblib
  metrics_path: artifacts/reports/text_metrics.json
  confusion_matrix_path: artifacts/reports/text_confusion_matrix.png
  train_path: data/splits/train.csv
  val_path: data/splits/val.csv
  test_path: data/splits/test.csv